<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0a0804"/>
    </radialGradient>
    <radialGradient id="goldBg" cx="25%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="35%" stop-color="#d4920a"/>
      <stop offset="70%" stop-color="#8a5c00"/>
      <stop offset="100%" stop-color="#3a2000"/>
    </radialGradient>
    <radialGradient id="goldBg2" cx="70%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="100%" stop-color="#8a5c00"/>
    </radialGradient>
    <filter id="glowBg">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgBg)"/>

  <!-- Main bangle ring -->
  <ellipse cx="200" cy="200" rx="140" ry="55" fill="none" stroke="url(#goldBg)" stroke-width="36" filter="url(#glowBg)"/>
  <!-- Outer edge highlight -->
  <ellipse cx="200" cy="200" rx="140" ry="55" fill="none" stroke="#ffe566" stroke-width="4" opacity="0.5"/>
  <!-- Inner edge shadow -->
  <ellipse cx="200" cy="200" rx="105" ry="22" fill="none" stroke="#3a2000" stroke-width="3" opacity="0.8"/>

  <!-- Intricate pattern - meenakari style dots -->
  <!-- Top arc dots -->
  <circle cx="200" cy="145" r="5" fill="#ffe566" stroke="#8a5c00" stroke-width="1.5"/>
  <circle cx="170" cy="149" r="4" fill="#ffe566" stroke="#8a5c00" stroke-width="1.5"/>
  <circle cx="230" cy="149" r="4" fill="#ffe566" stroke="#8a5c00" stroke-width="1.5"/>
  <circle cx="142" cy="161" r="4" fill="#ffe566" stroke="#8a5c00" stroke-width="1.5"/>
  <circle cx="258" cy="161" r="4" fill="#ffe566" stroke="#8a5c00" stroke-width="1.5"/>
  <circle cx="118" cy="179" r="3.5" fill="#ffe566" stroke="#8a5c00" stroke-width="1.5"/>
  <circle cx="282" cy="179" r="3.5" fill="#ffe566" stroke="#8a5c00" stroke-width="1.5"/>
  <!-- Bottom arc dots -->
  <circle cx="200" cy="255" r="5" fill="#ffe566" stroke="#8a5c00" stroke-width="1.5"/>
  <circle cx="170" cy="251" r="4" fill="#ffe566" stroke="#8a5c00" stroke-width="1.5"/>
  <circle cx="230" cy="251" r="4" fill="#ffe566" stroke="#8a5c00" stroke-width="1.5"/>
  <circle cx="142" cy="239" r="4" fill="#ffe566" stroke="#8a5c00" stroke-width="1.5"/>
  <circle cx="258" cy="239" r="4" fill="#ffe566" stroke="#8a5c00" stroke-width="1.5"/>

  <!-- Floral motifs at cardinal points -->
  <!-- Top motif -->
  <circle cx="200" cy="147" r="9" fill="#c8a020" stroke="#ffe566" stroke-width="2"/>
  <ellipse cx="200" cy="138" rx="5" ry="8" fill="#d4920a" opacity="0.8"/>
  <ellipse cx="200" cy="156" rx="5" ry="8" fill="#d4920a" opacity="0.8"/>
  <ellipse cx="191" cy="147" rx="8" ry="5" fill="#d4920a" opacity="0.8"/>
  <ellipse cx="209" cy="147" rx="8" ry="5" fill="#d4920a" opacity="0.8"/>
  <circle cx="200" cy="147" r="5" fill="#ffe566"/>

  <!-- Right motif -->
  <circle cx="337" cy="200" r="9" fill="#c8a020" stroke="#ffe566" stroke-width="2"/>
  <ellipse cx="337" cy="191" rx="5" ry="8" fill="#d4920a" opacity="0.8"/>
  <ellipse cx="337" cy="209" rx="5" ry="8" fill="#d4920a" opacity="0.8"/>
  <ellipse cx="328" cy="200" rx="8" ry="5" fill="#d4920a" opacity="0.8"/>
  <ellipse cx="346" cy="200" rx="8" ry="5" fill="#d4920a" opacity="0.8"/>
  <circle cx="337" cy="200" r="5" fill="#ffe566"/>

  <!-- Left motif -->
  <circle cx="63" cy="200" r="9" fill="#c8a020" stroke="#ffe566" stroke-width="2"/>
  <ellipse cx="63" cy="191" rx="5" ry="8" fill="#d4920a" opacity="0.8"/>
  <ellipse cx="63" cy="209" rx="5" ry="8" fill="#d4920a" opacity="0.8"/>
  <ellipse cx="54" cy="200" rx="8" ry="5" fill="#d4920a" opacity="0.8"/>
  <ellipse cx="72" cy="200" rx="8" ry="5" fill="#d4920a" opacity="0.8"/>
  <circle cx="63" cy="200" r="5" fill="#ffe566"/>

  <!-- Bottom motif -->
  <circle cx="200" cy="253" r="9" fill="#c8a020" stroke="#ffe566" stroke-width="2"/>
  <ellipse cx="200" cy="244" rx="5" ry="8" fill="#d4920a" opacity="0.8"/>
  <ellipse cx="200" cy="262" rx="5" ry="8" fill="#d4920a" opacity="0.8"/>
  <ellipse cx="191" cy="253" rx="8" ry="5" fill="#d4920a" opacity="0.8"/>
  <ellipse cx="209" cy="253" rx="8" ry="5" fill="#d4920a" opacity="0.8"/>
  <circle cx="200" cy="253" r="5" fill="#ffe566"/>

  <!-- Engraving lines on band -->
  <ellipse cx="200" cy="200" rx="140" ry="55" fill="none" stroke="#ffe566" stroke-width="1" stroke-dasharray="8,6" opacity="0.2"/>

  <!-- Reflection/shine on top of band -->
  <ellipse cx="200" cy="200" rx="140" ry="55" fill="none" stroke="white" stroke-width="3" opacity="0.07"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="290" rx="130" ry="18" fill="#c8a020" opacity="0.07"/>

  <text x="200" y="356" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#c8a020" letter-spacing="3">RJ HOUSE</text>
  <text x="200" y="376" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#888" letter-spacing="1">22K GOLD BANGLE</text>
</svg>
