<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="goldGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="40%" stop-color="#c8a020"/>
      <stop offset="100%" stop-color="#7a5a00"/>
    </radialGradient>
    <radialGradient id="diamondGrad" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e8f4ff"/>
      <stop offset="60%" stop-color="#a0c8ff"/>
      <stop offset="100%" stop-color="#4080c0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkle">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="200" x2="400" y2="200" stroke="#c8a020" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="400" stroke="#c8a020" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Ring band - ellipse at bottom -->
  <ellipse cx="200" cy="300" rx="90" ry="18" fill="none" stroke="url(#goldGrad)" stroke-width="22" filter="url(#glow)"/>
  <!-- Ring shank left side -->
  <path d="M 110 300 Q 95 240 115 200" fill="none" stroke="#c8a020" stroke-width="22" stroke-linecap="round"/>
  <!-- Ring shank right side -->
  <path d="M 290 300 Q 305 240 285 200" fill="none" stroke="#c8a020" stroke-width="22" stroke-linecap="round"/>
  <!-- Ring shank highlights -->
  <path d="M 110 300 Q 95 240 115 200" fill="none" stroke="#ffe566" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <path d="M 290 300 Q 305 240 285 200" fill="none" stroke="#ffe566" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

  <!-- Diamond setting prongs -->
  <path d="M 160 195 L 150 165" stroke="#ffe566" stroke-width="5" stroke-linecap="round"/>
  <path d="M 200 190 L 200 158" stroke="#ffe566" stroke-width="5" stroke-linecap="round"/>
  <path d="M 240 195 L 250 165" stroke="#ffe566" stroke-width="5" stroke-linecap="round"/>
  <path d="M 160 195 L 150 210" stroke="#c8a020" stroke-width="5" stroke-linecap="round"/>
  <path d="M 240 195 L 250 210" stroke="#c8a020" stroke-width="5" stroke-linecap="round"/>

  <!-- Diamond shape - brilliant cut -->
  <polygon points="200,130 240,165 225,210 175,210 160,165" fill="url(#diamondGrad)" filter="url(#glow)"/>
  <!-- Diamond facets -->
  <polygon points="200,130 220,160 200,155 180,160" fill="white" opacity="0.6"/>
  <polygon points="200,130 240,165 220,160" fill="#c0e0ff" opacity="0.5"/>
  <polygon points="200,130 160,165 180,160" fill="#80b0e0" opacity="0.4"/>
  <polygon points="200,155 225,210 200,200 175,210" fill="#6090c0" opacity="0.5"/>
  <polygon points="220,160 240,165 225,210 200,200" fill="#a0c8ff" opacity="0.4"/>
  <polygon points="180,160 160,165 175,210 200,200" fill="#d0e8ff" opacity="0.4"/>
  <!-- Diamond sparkles -->
  <circle cx="195" cy="148" r="2" fill="white" filter="url(#sparkle)"/>
  <circle cx="215" cy="158" r="1.5" fill="white" filter="url(#sparkle)"/>
  <circle cx="185" cy="162" r="1" fill="white" filter="url(#sparkle)"/>

  <!-- Sparkle effects -->
  <g filter="url(#sparkle)">
    <line x1="130" y1="120" x2="130" y2="105" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="123" y1="112" x2="137" y2="112" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="270" y1="130" x2="270" y2="118" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="264" y1="124" x2="276" y2="124" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="155" y1="85" x2="155" y2="76" stroke="#ffe566" stroke-width="1" opacity="0.9"/>
    <line x1="150" y1="80" x2="160" y2="80" stroke="#ffe566" stroke-width="1" opacity="0.9"/>
    <circle cx="310" cy="160" r="2" fill="white" opacity="0.5"/>
    <circle cx="90" cy="180" r="1.5" fill="#ffe566" opacity="0.6"/>
  </g>

  <!-- Label -->
  <text x="200" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#c8a020" letter-spacing="3">RJ HOUSE</text>
  <text x="200" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#888" letter-spacing="1">DIAMOND SOLITAIRE RING</text>
</svg>
